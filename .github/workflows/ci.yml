name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Generate local ad-hoc macOS and unsigned Windows packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          architecture: ${{ matrix.arch }}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:all
      # test:e2e includes the production build; do not build twice.
      - name: Electron build and E2E
        run: npm run test:e2e
      - name: Retain E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  package:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            script: package:mac
          - os: windows-2025
            script: package:win
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate distribution packages
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
