name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Generate local ad-hoc macOS and unsigned Windows packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          architecture: ${{ matrix.arch }}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:all
      - name: Electron production build
        id: app_build
        if: hashFiles('src/main/index.ts') != '' && hashFiles('src/preload/index.ts') != '' && hashFiles('src/renderer/index.html') != ''
        run: npm run build
      - name: Application not implemented
        if: steps.app_build.outcome == 'skipped'
        run: echo "Application not implemented; build not executed."
      - name: E2E (only when test files exist)
        id: e2e
        if: steps.app_build.outcome == 'success' && hashFiles('tests/e2e/**/*.e2e.ts', 'tests/e2e/**/*.test.ts', 'tests/e2e/**/*.spec.ts') != ''
        run: npm run test:e2e
      - name: E2E not executed
        if: steps.e2e.outcome == 'skipped'
        run: echo "E2E not executed; application entries and E2E specs are required."
      - name: Retain E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  package:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            script: package:mac
          - os: windows-2025
            script: package:win
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate distribution packages
        id: package_build
        if: hashFiles('src/main/index.ts') != '' && hashFiles('src/preload/index.ts') != '' && hashFiles('src/renderer/index.html') != ''
        run: npm run ${{ matrix.script }}
      - name: Packaging not executed
        if: steps.package_build.outcome == 'skipped'
        run: echo "Application not implemented; packaging not executed."
      - uses: actions/upload-artifact@v7
        if: steps.package_build.outcome == 'success'
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
