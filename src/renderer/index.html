<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:*; media-src 'self' blob:; object-src 'none'; base-uri 'none'"
    />

    <title>RasterTerm</title>
  </head>

  <body>
    <main id="app">
      <canvas id="ascii-canvas" class="ascii-canvas" role="img" aria-label="ASCII映像の表示領域">
        このアプリケーションではCanvasが必要です。
      </canvas>
    </main>

    <dialog
      id="video-error-dialog"
      aria-labelledby="video-error-title"
      aria-describedby="video-error-message"
    >
      <h2 id="video-error-title">ERROR</h2>
      <p id="video-error-message"></p>
      <form method="dialog">
        <button type="submit">閉じる</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
